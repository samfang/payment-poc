# Local development overrides. Never commit real secrets here.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_local
    username: payment
    password: payment

  security:
    oauth2:
      resourceserver:
        jwt:
          # Point to a local Keycloak or similar IdP for local dev
          issuer-uri: http://localhost:8180/realms/payment-poc

logging:
  level:
    com.example.paymentpoc: DEBUG
    org.springframework.security: DEBUG
