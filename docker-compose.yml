services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payment_local
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payment_local
      SPRING_PROFILES_ACTIVE: local
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
